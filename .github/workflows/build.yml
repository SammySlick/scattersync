name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Recreate signing keystore (deterministic)
        run: |
          keytool -genkeypair -v \
            -keystore scatter.keystore -alias scatter \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass scattersync -keypass scattersync \
            -dname "CN=ScatterSync, O=ScatterBrain"

      - name: Build signed APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScatterSync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
